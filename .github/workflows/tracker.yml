name: ICE Delay Tracker

on:
  schedule:
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: ICE-Verspätungen prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THRESHOLD_MINUTES: "20"
          TEST_NOTIFICATION: "false"
        run: python tracker.py

      - name: Gemeldete Züge speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "$(git status --porcelain notified_trains.json)" ]; then
            git add notified_trains.json
            git commit -m "Update notified trains"
            git push
          else
            echo "Keine Änderungen an notified_trains.json"
          fi
